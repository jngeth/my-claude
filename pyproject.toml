[project]
name = "my-claude"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["skills"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py39"  # skill scripts run on system python 3.9; keep pyupgrade off 3.10-only annotation syntax

[tool.ruff.lint]
extend-select = ["FA"]  # flag modern annotations missing `from __future__ import annotations` (needed on 3.9)
